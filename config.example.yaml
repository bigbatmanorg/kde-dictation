activation:
  mode: toggle           # toggle | push_to_talk

audio:
  # "default", a device id, or part of its description. List with: kde-dictation --list-devices
  device: default
  sample_rate: 16000
  max_recording_seconds: 900

transcription:
  mode: batch            # batch | realtime
  base_url: https://PASTE-YOUR-LITELLM-HOST
  # Paste the API key here for the simplest setup. This file is created with
  # mode 0600 by the installer, so only your user can read it.
  api_key_env: ""
  api_key: ""
  # Optional alternative for users who manage secrets through their session:
  # replace api_key_env with: LITELLM_API_KEY

  batch:
    model: whisper-1
    path: /v1/audio/transcriptions
    language: auto
    timeout_ms: 1200000

  realtime:
    path: /v1/realtime
    model: asr-realtime
    language: auto
    automatic_punctuation: true
    fallback_to_batch: true
    finalization_timeout_ms: 5000
    # Realtime mode inserts incremental Voxtral deltas into the focused field.
    live_insert: true
    # Coalesce very small token deltas before each paste operation.
    live_flush_ms: 75

output:
  method: clipboard_paste
  paste_shortcut: ctrl+v   # ctrl+v | shift+insert
  # Plasma Wayland needs a short delay for clipboard ownership to propagate.
  paste_delay_ms: 300
  # Realtime chunks use a shorter delay so words appear while you speak.
  live_paste_delay_ms: 40
  # Key-injection backend: auto | ydotool | xdotool
  #   auto: xdotool on X11 when installed, otherwise ydotool (always on Wayland)
  backend: auto
  # ydotool only. Leave empty to auto-discover a running ydotoold; when none is
  # reachable the app starts a private one (disable with ydotool_autostart: false).
  ydotool_socket: ""
  ydotool_autostart: true

logging:
  log_transcripts: false
